# targetNodes:
#   - id: 8c824c84e03de12e73fe286222c00faa3d8fd152
#   - id: 1c824c84e03de12e73fe286222c00faa3d8fd152
#   - id: 481029997EFfD67A74b48C98D763e2a2147e68A6
#   - id: "*"
# # use id: "*" to target all nodes
# # used 1440 to spread over a day.
# updateResolution: 120
# # can be immediate or scheduled
# updateMode: immediate
# updateInAction: true
# # can be commit id or latest
# commit: latest
# ---- UPDATE-DESCRIPTOR-END ----

# 50m x 3 caps each service at 150MB and the whole stack at about 1.5GB, down from a
# theoretical 6GB. Not tighter than that on purpose: container logs are how a long-running
# hang is diagnosed, by showing exactly when a run loop stopped, so the window needs to
# stay wide enough to cover something that has been failing for a while.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  nginx:
    logging: *default-logging
    container_name: nginx
    image: nginx:latest
    ports:
      - 80:80
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./.data:/opt/orbs
    depends_on:
      - logger
    healthcheck:
      test: service nginx status || exit 1

  ethereum-reader:
    logging: *default-logging
    container_name: ethereum-reader
    # Pinned by digest: a tag can be re-pushed on Docker Hub, the digest cannot.
    image: orbsnetworkstaging/evm-reader:v5.3.3@sha256:912c206902de7cefc07b211c6f86558a95b8e8b47f7151e5ef9e4818e072ab1a
    command: "npm start"
    # Also holds the state cache (cache/state.json.gz), so a restart resumes instead of
    # replaying from the first block. nginx serves only status.json from here.
    volumes:
      - ./.data/ethereum-reader:/opt/orbs/status
    environment:
      - NODE_ADDRESS
      - ETHEREUM_ENDPOINT
    # The image is built without boyar's healthcheck.js, so check the status file's age like
    # the other services do.
    healthcheck:
      test: "test $$(( $$(date +%s) - $$(stat -c %Y /opt/orbs/status/status.json) )) -lt 600"
    networks:
      default:
        aliases:
          - management-service

  matic-reader:
    logging: *default-logging
    container_name: matic-reader
    image: orbsnetworkstaging/evm-reader:v5.3.3@sha256:912c206902de7cefc07b211c6f86558a95b8e8b47f7151e5ef9e4818e072ab1a
    command: "npm start"
    # Also holds the state cache, like ethereum-reader's.
    volumes:
      - ./.data/matic-reader:/opt/orbs/status
    environment:
      - NODE_ADDRESS
      - ETHEREUM_GENESIS_CONTRACT=0x35eA0D75b2a3aB06393749B4651DfAD1Ffd49A77
      - ETHEREUM_ENDPOINT=${MATIC_ENDPOINT}
      # The block before the registry was deployed on Polygon (25502848); nothing earlier
      # holds an event. Changing it invalidates the state cache, so only change it on purpose.
      - ETHEREUM_FIRST_BLOCK=25502847
      - ETHEREUM_POLL_INTERVAL_SECONDS=300
      # rpcman's Polygon backends reject getLogs ranges over 10k blocks and time out on wide
      # ones, so keep every page at 10k and give up on a hung request after 10s. Measured:
      # about 3k blocks/s with no RPC errors. ethereum-reader keeps the defaults.
      - ETHEREUM_HTTP_TIMEOUT_SECONDS=10
      - ETHEREUM_GETLOGS_INITIAL_PAGE_BLOCKS=10000
      - ETHEREUM_GETLOGS_MAX_PAGE_BLOCKS=10000
    healthcheck:
      test: "test $$(( $$(date +%s) - $$(stat -c %Y /opt/orbs/status/status.json) )) -lt 600"

  ethereum-writer:
    logging: *default-logging
    container_name: ethereum-writer
    image: lukerogerson1/ethereum-writer:v1.7.3-main
    command: "npm start"
    volumes:
      - ./.data/ethereum-writer:/opt/orbs/status
    environment:
      - ETHEREUM_ELECTIONS_CONTRACT=0x02Ca9F2c5dD0635516241efD480091870277865b
      - ETHEREUM_ENDPOINT
      # No NODE_PRIVATE_KEY: the writer never reads it, it signs through the signer.
      - SIGNER_ENDPOINT
      - NODE_ADDRESS
      - MANAGEMENT_SERVICE_ENDPOINT=http://nginx/service/ethereum-reader
    healthcheck:
      test: node healthcheck.js || exit 1

  signer:
    logging: *default-logging
    container_name: signer
    image: orbsnetworkstaging/signer:v2.6.0-59e1b92f
    command: "/opt/orbs/orbs-signer"
    volumes:
      - ./.data/signer:/opt/orbs/status
    environment:
      - NODE_PRIVATE_KEY
      - NODE_ADDRESS
      - HTTP_ADDRESS=:80
    healthcheck:
      test: "/opt/orbs/healthcheck --url http://localhost:80 --output /opt/orbs/status/status.json"

  logger:
    logging: *default-logging
    container_name: logger
    build:
      context: ./logging
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - ./.data/logger:/opt/orbs/status
      # So the components that are not containers - control, updater, recovery - can have
      # their log files served from here too. Read-only: this service only ever reads them.
      - ./.data:/opt/orbs/logs:ro
    environment:
      - STATUS_FILE_PATH=/opt/orbs/status/status.json
    healthcheck:
      test: "test $$(( $$(date +%s) - $$(stat -c %Y /opt/orbs/status/status.json) )) -lt 600"

  vm-notifications:
    logging: *default-logging
    container_name: vm-notifications
    platform: linux/amd64
    image: orbsnetwork/vm-notifications:v1.0.31
    entrypoint: ["/opt/orbs/service"]
    restart: unless-stopped
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - ./.data/vm-notifications:/opt/orbs/status
    environment:
      - MULTILOG_DISABLED=1
      - STATUS_FILE_PATH=/opt/orbs/status/status.json
    healthcheck:
      test: "test $$(( $$(date +%s) - $$(stat -c %Y /opt/orbs/status/status.json) )) -lt 600"

  vm-lambda:
    logging: *default-logging
    container_name: vm-lambda
    image: orbsnetworkstaging/vm-lambda:v5
    restart: unless-stopped
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - ./.data/vm-lambda:/opt/orbs/status
    environment:
      - NODE_ENV=prod
      - MULTILOG_DISABLED=1      
      - LAMBDA_GIT_TAG=feature/v5                                                                                                                                                                                              
      - LAMBDA_PROJECTS_DIR=./orbs-lambda/projects                                                                                                                                                                        
      - LAMBDA_MGMT_SERVICE_URL=http://nginx/service/ethereum-reader/status
      - LAMBDA_SIGNER_ENDPOINT=http://nginx/service/signer
      - LAMBDA_STATUS_JSON_PATH=./status/status.json 
    healthcheck:
      test: "test $$(( $$(date +%s) - $$(stat -c %Y /opt/orbs/status/status.json) )) -lt 600"
  vm-verifier:
    logging: *default-logging
    container_name: vm-verifier
    image: orbsnetworkstaging/vm-verifier:v1.0.15
    restart: unless-stopped
    volumes:
      - ./.data/vm-verifier:/opt/orbs/status
    environment:
      - STATUS_FILE_PATH=/opt/orbs/status/status.json
    depends_on:
      - ethereum-reader
    healthcheck:
      test: "test $$(( $$(date +%s) - $$(stat -c %Y /opt/orbs/status/status.json) )) -lt 600"

networks:
  default:
    name: custom_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
