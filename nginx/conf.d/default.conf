server {
    listen 80;
    server_name _;

    # Use Docker default network DNS resolver (required for variable-based proxy_pass)
    resolver 127.0.0.11 ipv6=off valid=30s;

    # rewrite all plural service(s) and log(s) to a single form
    location ~* ^/services/(.*)$ {
        rewrite ^/services/(.*)$ /service/$1 last;
    }

    # rewrite all "boyar" with "control"
    location ~* ^/service/boyar/(.*)$ {
        rewrite ^/service/boyar/(.*)$ /service/control/$1 last;
    }
    # rewrite all "log-service" with "logger"
    location ~* ^/service/logs-service/(.*)$ {
        rewrite ^/service/logs-service/(.*)$ /service/logger/$1 last;
    }
    # rewrite all "management-service" as "ethereum-reader"
    location ~* ^/service/management-service/(.*)$ {
        rewrite ^/service/management-service/(.*)$ /service/ethereum-reader/$1 last;
    }

    # control, updater and recovery are not served here as static files: an alias would
    # silently ignore the query parameters, so ?tail=300 would return the whole file.
    # They fall through to the logger proxy below, which reads the same files and
    # honours tail, so every component answers the same URL the same way.

    # Expose container status pages (from vol/<service>/)
    location ~* ^/service/([a-zA-Z0-9_-]+)/status$ {
        default_type application/json;
        alias /opt/orbs/$1/status.json;
    }

    # control log is a special case as it is not a service

    # Expose container logs (rewrite request to always be in /log in single )
    #
    # The upstream goes through a variable deliberately. nginx resolves a literal
    # hostname in proxy_pass once, at configuration load, and caches the address for the
    # life of the process - the resolver above is not consulted at all. So when the
    # logger container is recreated and takes a new IP, nginx keeps proxying to the old
    # address, possibly by then held by another container, and every log request 404s.
    # A variable cannot be resolved at load time, which forces per-request resolution
    # through the resolver, and the route survives a recreate within valid=30s.
    #
    # Do not simplify this back to `proxy_pass http://logger`, and do not replace it
    # with an `upstream logger` block: upstream servers are also resolved once at load
    # in open source nginx, and the group would additionally shadow this lookup, since
    # a variable resolving to a name that matches an upstream group uses that group
    # instead of DNS.
    location ~ ^/service/([a-zA-Z0-9_.-]+)/logs?$ {
        set $logger_upstream logger;
        rewrite ^/service/([a-zA-Z0-9_.-]+)/logs? /service/$1/log break;
        proxy_pass http://$logger_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Match any service starting with "vm-" and extract its name and remaining path
    # VM API calls
    #
    # The name is restricted to what a compose service name can be. It goes straight into
    # proxy_pass and is resolved through Docker's DNS, which forwards anything it does not
    # know to the host's resolvers - so a name allowed to carry dots or a port, such as
    # vm-x.attacker.example:8080, made this an open proxy to any host, including addresses
    # inside custom_network like the signer's.
    location ~* ^/service/(vm-[a-zA-Z0-9_-]+)(/.*)?$ {
        # Extract the service name
        set $service_name $1;

        # Rewrite the URI: remove /service/<SERVICE_NAME> and keep the remaining path
        # If path exists: /service/vm-lambda/path -> /path
        # If no path: /service/vm-lambda -> / (empty string becomes /)
        rewrite ^/service/(vm-[a-zA-Z0-9_-]+)(/.*)?$ $2 break;
        # Ensure we have at least / if path was empty
        rewrite ^$ / break;

        # Pass the request to the backend
        proxy_pass http://$service_name;

        # Preserve headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
